<style>
:root{
  --g950:#0b0f17; --g900:#111827; --g850:#18202e; --g800:#1f2937; --g750:#2b3544; --g700:#374151; --g600:#4b5563; --g500:#6b7280; --g400:#9ca3af; --g300:#d1d5db; --g200:#e5e7eb;
  --amber:#fcd34d; --brand:#8b0000; --brand2:#b91c1c; --brand3:#f87171; --emerald:#059669;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--g900);color:var(--g200);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
#app{display:flex;flex-direction:column;height:100vh}

/* ---------- Header ---------- */
header{background:var(--g800);border-bottom:1px solid var(--g700);display:flex;align-items:center;gap:8px;padding:8px 8px;z-index:20;flex-wrap:nowrap;min-height:54px}
.wordmark{margin:0 8px 0 4px;flex:none;line-height:0}
.wordmark img{height:26px;width:auto;display:block}
@media (max-width:1250px){.wordmark img{height:20px}}
.hbtn .chev{width:11px;height:11px;opacity:.7;margin-left:-2px}
.hbtn.wchev{padding:0 5px 0 7px;gap:3px}
.hgroup{display:flex;align-items:center;gap:4px;padding:3px;background:var(--g850);border:1px solid var(--g700);border-radius:7px;flex:none}
.hbtn{height:34px;min-width:34px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--g700);border:1px solid var(--g600);border-radius:5px;cursor:pointer;color:var(--g200);white-space:nowrap}
.hbtn:hover{background:var(--g600)}
.hbtn:disabled{opacity:.4;cursor:default}
.hbtn svg{width:18px;height:18px;flex:none}
.hbtn .chev{color:var(--g400)}
[data-act="undo"] svg,[data-act="redo"] svg{color:#fcd34d}
[data-act="new"] svg{color:#4ade80}
[data-menu="m-image"] svg:first-child{color:#60a5fa}
[data-menu="m-layer"] svg:first-child{color:#a78bfa}
[data-menu="m-sel"] svg:first-child{color:#22d3ee}
[data-menu="m-filters"] svg:first-child{color:#f472b6}
[data-act="fullscreen"] svg{color:#93c5fd}
[data-menu="m-file"] svg{color:#60a5fa}
[data-menu="m-export"] svg{color:#fb923c}
[data-act="guide"] svg{color:#facc15}
[data-act="settings"] svg{color:#c4b5fd}
.hbtn:disabled svg{color:var(--g500)!important}
.hbtn.ico{padding:0}
.hbtn{flex:none}
.menu.right{min-width:300px}
@media (max-width:1240px){.install .lbl{display:none}.hbtn.install{padding:0 8px}}
@media (max-width:1020px){.hgroup .hbtn .lbl{display:none}}
.hbtn.install{background:var(--emerald);border-color:#10b981;color:#fff;font-weight:600}
.hbtn.install:hover{background:#10b981}
.spacer{flex:1}
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:250px;background:var(--g800);border:1px solid var(--g600);border-radius:8px;padding:5px;z-index:100}
.menu.right{left:auto;right:0}
.menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:18px;padding:6px 10px;background:none;border:0;border-radius:5px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--g700)}
.menu .sub{position:relative}
.menu .sub>button::after{content:"";width:6px;height:6px;border-right:2px solid var(--g400);border-top:2px solid var(--g400);transform:rotate(45deg);margin-right:3px}
.menu .sub:hover>button{background:var(--g700)}

/* paramètres */
.dlg.wide{width:min(720px,94vw)}
.stabs{display:flex;gap:2px;border-bottom:1px solid var(--g700);margin:-14px -16px 4px;padding:0 10px}

/* guide */

#mc-root{position:absolute;inset:0;pointer-events:none;z-index:40;font-family:system-ui,'Segoe UI',sans-serif}
#mc-momo{pointer-events:auto;position:absolute;left:10px;bottom:0;width:62px;height:76px;cursor:pointer;transform:translateY(46px);isolation:isolate;transition:transform .28s cubic-bezier(.3,1.4,.5,1)}
#mc-momo svg{width:100%;height:100%}
#mc-momo:hover{transform:translateY(27px)}
#mc-root.open #mc-momo{transform:translateY(0)}
#mc-momo.think svg{animation:mc-think .9s ease-in-out infinite;transform-origin:50% 80%}
#mc-momo .mc-eye{transform-box:fill-box;transform-origin:center;animation:mc-blink 5s infinite}
@keyframes mc-blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.15)}}
@keyframes mc-think{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
#mc-hint{position:absolute;z-index:-1;top:-4px;right:-12px;background:#2563eb;color:#fff;font-weight:900;font-size:12px;border-radius:10px;padding:0 6px;line-height:18px}
#mc-hint::after{content:'';position:absolute;left:4px;bottom:-4px;border-style:solid;border-width:5px 4px 0 4px;border-color:#2563eb transparent transparent}
#mc-hint.busy::after{border-top-color:#1d4ed8}#mc-hint.news::after{border-top-color:#dc2626}
#mc-root.open #mc-hint{display:none}
#mc-hint.busy{background:#1d4ed8;color:#fff;padding:0;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
#mc-hint.busy i{display:flex;animation:mcGear 1.4s linear infinite}
#mc-hint.news{background:#dc2626;color:#fff;padding:0;width:20px;height:20px;text-align:center;animation:mcPing 1.2s ease-in-out infinite}
@keyframes mcGear{to{transform:rotate(360deg)}}
@keyframes mcPing{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
#mc-mini{display:none;pointer-events:auto;cursor:pointer;position:absolute;left:82px;bottom:10px;background:#1e3a8a;color:#dbeafe;border:1px solid #3b82f6;border-radius:10px;padding:4px 10px;font-size:12px;white-space:nowrap}
#mc-root.busy:not(.open) #mc-mini{display:block}
#mc-panel{display:none;pointer-events:auto;position:absolute;left:10px;bottom:82px;width:390px;max-width:calc(100vw - 40px);height:min(540px,calc(100% - 100px));flex-direction:column;background:#111827f7;border:1.5px solid #f5c518;border-radius:14px;color:var(--g200);font-size:13.5px;line-height:1.5;overflow:hidden}
#mc-root.open #mc-panel{display:flex}
#mc-root.pinned #mc-panel{border-width:3px;border-style:double}
#mc-root.pinned #mc-pin{color:#f5c518;transform:rotate(-30deg)}
.mc-h{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 8px 12px;background:var(--g800);border-bottom:1px solid var(--g700);font-weight:800;color:#fde047}
.mc-h>span:first-child{display:flex;align-items:center;gap:7px}
.mc-hb{display:flex;gap:2px}
.mc-hb button{background:none;border:0;color:var(--g400);padding:4px;border-radius:5px;display:flex}
.mc-hb button:hover{color:#fff;background:var(--g700)}
#mc-set{display:none;flex:1;overflow-y:auto;padding:10px 12px;flex-direction:column;gap:8px}
#mc-root.set #mc-set{display:flex}
#mc-root.set #mc-log,#mc-root.set #mc-sugg,#mc-root.set .mc-in{display:none}
.mc-form{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.mc-form>span{color:var(--g400);margin-top:4px}
.mc-form select{width:100%}
.mc-form .ps-seg{align-self:flex-start}
#mc-log{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mc-m{max-width:92%;padding:7px 10px;border-radius:12px}
.mc-m p{margin:0 0 4px}.mc-m p:last-child{margin-bottom:0}
.mc-m ul{margin:2px 0 4px;padding-left:18px;list-style:disc}.mc-m li{margin:1px 0}
.mc-m kbd{padding:0 4px;border:1px solid var(--g500);border-radius:4px;background:var(--g800);color:#fde68a;font-size:12px}
.mc-a{align-self:flex-start;background:var(--g800);border:1px solid var(--g700);border-top-left-radius:4px}
.mc-u{align-self:flex-end;background:#6b4e07;color:#fefce8;border-top-right-radius:4px}
.mc-err{border-color:#b91c1c;background:#450a0a}
.mc-btn{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;margin:1px 2px;padding:1px 7px 1px 3px;border-radius:6px;background:var(--g700);border:1px solid #f5c518;color:#fde68a;font-size:12px;cursor:pointer}
.mc-btn svg{width:15px;height:15px}
.mc-btn:hover{background:var(--g600)}
#mc-sugg{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 6px}
#mc-sugg button{font-size:12px;padding:3px 9px;border-radius:12px;border:1px solid var(--g600);background:var(--g800);color:var(--g300)}
#mc-sugg button:hover{border-color:#f5c518;color:#fde68a}
.mc-in{display:flex;gap:6px;padding:8px;border-top:1px solid var(--g700);background:#0f172a}
.mc-in textarea{flex:1;resize:none;background:var(--g800);color:#fff;border:1px solid var(--g600);border-radius:8px;padding:6px 8px;font-size:13px;outline:none;min-height:38px}
.mc-in textarea:focus{border-color:#f5c518}
.mc-in button{width:42px;border-radius:8px;border:0;background:#f5c518;color:#111827;display:flex;align-items:center;justify-content:center}
.mc-in button:hover{background:#facc15}
.mc-in button.stop{background:#dc2626;color:#fff}
.mc-status{color:#c4b5fd;font-style:italic;display:flex;align-items:center;gap:6px}
.mc-status i{display:flex;animation:mcGear 1.4s linear infinite}
.mc-st-t{color:var(--g500);font-size:11px;font-style:normal}
.mc-acts{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.mc-act{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;padding:4px 7px;border-radius:7px;background:#0f172a;border:1px solid #334155}
.mc-act .ic-svg{margin-top:2px}
.mc-act.mc-ok{border-color:#166534;color:#bbf7d0}.mc-act.mc-no{border-color:#7f1d1d;color:#fecaca}.mc-act.mc-err{border-color:#92400e;color:#fde68a}.mc-act.mc-ask{border-color:#f5c518;color:#fef9c3}
.mc-ask{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 4px}
.mc-ask button{font-size:12px;padding:3px 9px;border-radius:6px;border:1px solid var(--g600);background:var(--g800);color:var(--g200)}
.mc-ask button:first-child{background:#16a34a;border-color:#16a34a;color:#fff;font-weight:700}
.mc-ask button:last-child{color:#fca5a5}
.mc-undo{font-size:11.5px;color:var(--g400);margin-top:2px}
.mc-ring{position:fixed;z-index:950;pointer-events:none;border:2px solid #f5c518;border-radius:8px;animation:mc-pulse 1s ease-in-out infinite}
@keyframes mc-pulse{0%,100%{box-shadow:0 0 0 3px #f5c51844}50%{box-shadow:0 0 0 8px #f5c51822}}
@media (prefers-reduced-motion:reduce){#mc-momo .mc-eye,#mc-momo.think svg{animation:none}}
"""

.mc-keyrow{display:flex;gap:5px;align-items:center}
.mc-keyrow input{flex:1;min-width:0;background:var(--g900);border:1px solid var(--g600);border-radius:5px;padding:5px 7px;color:#fff;font:12px ui-monospace,monospace}
#mc-set select{background:var(--g900);border:1px solid var(--g600);border-radius:5px;padding:5px 7px;color:var(--g200)}
#mc-set .note{font-size:12px;color:var(--g400);margin:0}
.dbtn{background:var(--g700);border:1px solid var(--g600);border-radius:5px;padding:5px 9px;color:var(--g200);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.dbtn:hover{background:var(--g600)}
.dbtn.primary{background:var(--brand);border-color:var(--brand2);color:#fff}
.ps-seg{display:inline-flex;border:1px solid var(--g600);border-radius:6px;overflow:hidden}
.ps-seg button{background:var(--g800);border:0;color:var(--g300);padding:5px 14px;font-size:12.5px;cursor:pointer}
.ps-seg button+button{border-left:1px solid var(--g600)}
.ps-seg button.on{background:var(--brand2);color:#fff;font-weight:700}
.ps-sub{font-size:11.5px;color:var(--g500)}
.ia-grid{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;align-items:center}
.ia-grid>span{color:var(--g400);font-size:12.5px}
.ia-perm{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border:1px solid var(--g700);border-radius:7px;margin-bottom:5px;cursor:pointer}
.ia-perm:has(input:checked){border-color:var(--brand3);background:#2a1414}
.ia-perm input{margin-top:3px;accent-color:var(--brand2)}
.ic-svg{flex:none;vertical-align:middle}

#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--g700);border:1px solid var(--g500);padding:9px 16px;border-radius:8px;z-index:600;display:flex;gap:12px;align-items:center;max-width:80vw}
.custom-scroll::-webkit-scrollbar,#layers::-webkit-scrollbar,aside::-webkit-scrollbar{width:8px;height:8px}
#layers::-webkit-scrollbar-thumb,aside::-webkit-scrollbar-thumb{background:var(--g600);border-radius:4px}
</style>

<style>

#ms-splash .ms-white{position:absolute;inset:0;background:#fffdf4;opacity:0;z-index:5;animation:ms-white 5.9s linear both}
#ms-splash .ms-box{position:relative;z-index:2;width:min(36vmin,360px);aspect-ratio:1280/1240}

#ms-splash .ms-draw{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#ms-splash .ms-m1{transform-origin:422px 421px;animation:ms-m1 1.45s both}
#ms-splash .ms-m2{transform-origin:422px 799px;animation:ms-m2 1.45s both}
#ms-splash .ms-o1,#ms-splash .ms-o2{transform-box:fill-box;transform-origin:center}
#ms-splash .ms-o1{animation:ms-o 1s .08s both}
#ms-splash .ms-o2{animation:ms-o 1s .2s both}
#ms-splash .ms-cam{position:absolute;left:69.219%;top:1.29%;width:30.156%;height:32.742%;transform-origin:50% 50%;
  animation:ms-cam-in .6s cubic-bezier(.34,1.6,.64,1) 1.7s both,ms-aim 5.9s linear both}
#ms-splash .ms-cam img{position:absolute;inset:0;width:100%;height:100%}

#ms-splash .ms-glow{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,#ffffff 0%,#fffbe0 22%,rgba(255,240,170,.75) 42%,rgba(255,240,170,0) 70%);opacity:0;transform:scale(0);animation:ms-glow 5.9s linear both}

@keyframes ms-o{0%{opacity:0;transform:scale(.5)}22%{opacity:1;transform:scale(1)}58%{opacity:1;transform:scale(1);animation-timing-function:cubic-bezier(.6,-.4,.7,.4)}85%,100%{opacity:0;transform:scale(0)}}

   Format natif .mms = JSON { format:"MOMOShop", version, width, height, layers:[{…, data:PNG dataURL}] }

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const DPR = () => window.devicePixelRatio || 1;
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return c; }
function cloneCanvas(src) { const c = mkCanvas(src.width, src.height); c.getContext('2d').drawImage(src, 0, 0); return c; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ---------------- icônes ---------------- */

  crop: SV('<path d="M6 2v16h16"/><path d="M2 6h16v16"/>'),
  brush: SV('<path d="M19 3.3a2.1 2.1 0 0 1 3 3L12.5 15.8l-3-3z"/><path d="M9.5 12.8c-2.3 0-4.3 1.6-4.3 4 0 1.6-1.1 2.6-3.2 3.2 3.2 1 7.4 1 9-1.1 1.1-1.6 1-3.9-1.5-6.1z"/>'),

/* ---------------- backup auto (IndexedDB) ---------------- */
const IDB = { db: null,
  open() { return this.db ? Promise.resolve(this.db) : new Promise((res, rej) => { const r = indexedDB.open('momoshop', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(this.db = r.result); r.onerror = () => rej(r.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); } };
let backupTimer = 0, lastBackup = null;
async function doBackup(manual) {
  if (!doc || drag) return;
  try { await IDB.set('backup', { time: Date.now(), name: doc.name, data: serialize() }); lastBackup = Date.now(); updateBackupInfo(); if (manual) toast('Sauvegarde auto effectuée.'); }
  catch (e) { if (manual) toast('Sauvegarde impossible : ' + e.message); }
}
function setBackupInterval(min) {
  clearInterval(backupTimer); S.backup = +min; saveSettings(); $('#backup-int').value = String(S.backup);
  if (+min > 0) backupTimer = setInterval(() => { if (dirty) doBackup(false); }, min * 60000);
  updateBackupInfo();
}
function updateBackupInfo() {
  const min = +$('#backup-int').value;
  $('#backup-info').textContent = (min ? `Toutes les ${min} min · ` : 'Désactivé · ') + (lastBackup ? 'dernière : ' + new Date(lastBackup).toLocaleTimeString('fr-FR') : 'aucune sauvegarde');
}
async function restoreBackup() {
  const b = await IDB.get('backup').catch(() => null);
  if (!b) return toast('Aucune sauvegarde auto disponible.');
  if (dirty && !await confirmDlg(`Remplacer le document actuel par la sauvegarde « ${b.name} » du ${new Date(b.time).toLocaleString('fr-FR')} ?`)) return;
  await loadMms(JSON.parse(b.data)); saveTarget = { handle: null, fmt: 'mms' }; markDirty(true); toast('Sauvegarde restaurée.');
}
$('#backup-int').onchange = e => setBackupInterval(+e.target.value);

/* ---------------- dialogues & toasts ---------------- */
function dialog({ title, body, ok = 'OK', cancel = 'Annuler', alt, onOpen, wide, light }) {
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'ovl'; if (light) { o.style.background = 'transparent'; o.style.alignItems = 'flex-end'; o.style.paddingBottom = '44px'; }
    o.innerHTML = `<div class="dlg${wide ? ' wide' : ''}"><h3>${title}</h3><div class="db">${body}</div><div class="df">${cancel ? `<button class="btn" data-cancel>${cancel}</button>` : ''}${alt ? `<button class="btn" data-alt>${alt}</button>` : ''}<button class="btn primary" data-ok>${ok}</button></div></div>`;
    document.body.appendChild(o);
    const close = v => { o.remove(); res(v); };
    o.querySelector('[data-ok]').onclick = () => close(o);
    o.querySelector('[data-cancel]') && (o.querySelector('[data-cancel]').onclick = () => close(null));
    o.querySelector('[data-alt]') && (o.querySelector('[data-alt]').onclick = () => close('alt'));
    o.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); close(o); } e.stopPropagation(); });
    onOpen && onOpen(o); (o.querySelector('input[type=text],input[type=number]') || o.querySelector('[data-ok]')).focus();
  });
}
const confirmDlg = msg => dialog({ title: 'Confirmation', body: `<div>${esc(msg)}</div>`, ok: 'Continuer' }).then(r => !!r);
const promptDlg = (msg, v) => dialog({ title: msg, body: `<input type="text" id="p-v" value="${esc(v)}">` }).then(r => r ? r.querySelector('#p-v').value.trim() : null);
let toastTimer = 0;
function toast(msg, btn) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if (btn) { const b = document.createElement('button'); b.className = 'btn primary'; b.textContent = btn.label; b.onclick = () => { t.remove(); btn.fn(); }; t.appendChild(b); }
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), btn ? 12000 : 2800);
}

function buildGuide() {
  let nav = '', body = '';
  for (const [id, ico, name, subs] of GUIDE) {
    nav += `<button class="hg-tab" data-ch="${id}"><span class="hg-ico">${ico}</span>${name}</button>`;
    body += `<section class="hg-ch" data-ch="${id}"><h2 class="hg-title"><span>${ico}</span> ${name}</h2>`;
    for (const [sub, list] of subs) { if (sub) body += `<h3 class="hg-sub">${sub}</h3>`; body += `<ul class="hg-list">${list.join('')}</ul>`; }
    body += '</section>';
  }
  const g = document.createElement('div'); g.id = 'guide'; g.className = 'hidden';
  g.innerHTML = `<div class="gbox"><div class="ghead"><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>Guide MomoPIC</h3>
    <div class="gsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.4-4.4"/></svg><input id="g-q" type="search" placeholder="Rechercher une fonction (ex. calque, PNG, baguette, flou…)" autocomplete="off"></div>
    <button class="gclose" title="Fermer (Échap)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="gmain"><nav>${nav}</nav><div class="gbody">${body}<div id="g-res"></div></div></div></div>`;
  document.body.appendChild(g);
  g.addEventListener('click', e => { if (e.target === g || e.target.closest('.gclose')) closeGuide(); const t = e.target.closest('.hg-tab'); if (t) guideChapter(t.dataset.ch); });
  g.addEventListener('keydown', e => { if (e.key === 'Escape') closeGuide(); e.stopPropagation(); });
  g.querySelector('#g-q').addEventListener('input', e => guideSearch(e.target.value));
}
function openGuide() { closeMenus(); const g = $('#guide'); g.classList.remove('hidden'); const q = $('#g-q'); q.value = ''; guideSearch(''); if (!$('#guide .hg-tab.on')) guideChapter('start'); setTimeout(() => q.focus(), 30); }
function closeGuide() { $('#guide').classList.add('hidden'); }
function guideChapter(id) { $$('#guide .hg-tab').forEach(b => b.classList.toggle('on', b.dataset.ch === id)); $$('#guide .hg-ch').forEach(c => c.classList.toggle('on', c.dataset.ch === id)); const q = $('#g-q'); if (q.value) { q.value = ''; guideSearch(''); } $('#guide .gbody').scrollTop = 0; }
function guideSearch(q) {
  const res = $('#g-res'); q = q.trim().toLowerCase();
  const norm = t => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  if (!q) { res.innerHTML = ''; $$('#guide .hg-ch').forEach(c => c.style.display = ''); return; }
  $$('#guide .hg-ch').forEach(c => c.style.display = 'none');
  const nq = norm(q); let html = '', n = 0;
  for (const sec of $$('#guide .hg-ch')) {
    const hits = [...sec.querySelectorAll('.hg-list > li')].filter(li => norm(li.textContent).includes(nq));
    if (!hits.length) continue; n += hits.length;
    html += `<div class="hg-res-ch" data-go="${sec.dataset.ch}">${sec.querySelector('.hg-title').textContent.trim()}</div><ul class="hg-list">` + hits.map(li => '<li>' + highlight(li.innerHTML, q) + '</li>').join('') + '</ul>';
  }
  res.innerHTML = n ? `<h2 class="hg-title">🔎 ${n} résultat${n > 1 ? 's' : ''}</h2>` + html : '<div class="note" style="padding:20px 0">Aucun résultat.</div>';
  res.querySelectorAll('[data-go]').forEach(d => d.onclick = () => guideChapter(d.dataset.go));
}
function highlight(html, q) {
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return html.replace(/(<[^>]+>)|([^<]+)/g, (m, tag, txt) => tag ? tag : txt.replace(re, '<span class="hg-hit">$1</span>'));
}

function act(a) {
  closeMenus(); if (!doc) return;
  const [k, v] = a.split(':');
  switch (k) {
    case 'new': return newDocDialog();
    case 'open': return openFile();
    case 'save': return saveDoc();

  blocks.forEach(b => { if (!b) return; if (b.type === 'text' && b.text) parts.push({ text: b.text }); else if (b.type === 'tool_use') { let args = b.input || {}; if (b.json) { try { args = JSON.parse(b.json); } catch (e) {} } const fc = { id: b.id, name: b.name, args }; parts.push({ functionCall: fc }); calls.push(fc); } });
  if (!parts.length) throw new Error('Réponse vide du fournisseur.');
  return { text, calls, parts };
}
